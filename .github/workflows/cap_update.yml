name: 수동 시가총액 업데이트

on:
  workflow_dispatch: # 💡 이 마법의 한 줄이 깃허브에 'Run workflow(수동 실행)' 버튼을 만들어줍니다!

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 도구 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests

    - name: 파이썬 파일 실행!
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        DATABASE_ID: ${{ secrets.DATABASE_ID }}
      run: python stock_cap.py